[build]
  command = "npm run build"
  publish = "dist/app"          # ← sem /browser, igual ao que o Angular gera
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200